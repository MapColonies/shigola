{{- if .Values.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shigola.fullname" . }}
  labels:
    {{- include "shigola.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol }}
  selector:
    {{- include "shigola.selectorLabels" . | nindent 4 }}
{{- end }}
