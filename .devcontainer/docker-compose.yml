services:
  dev:
    build:
      # Relative to the compose *project directory* -- the directory of the
      # first -f file. That is the repo root in every supported invocation,
      # including devcontainer.json, which lists ../docker-compose.yml first.
      #
      # So this file is not usable on its own: passing it first makes itself the
      # project directory, which resolves the root file's ./testdata mount under
      # .devcontainer/. Always pass the root compose file first.
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: shigola-dev
    command: sleep infinity
    working_dir: /workspace/shigola
    volumes:
      # ".", not "..", for the same reason as the build context above: ".."
      # mounted the directory holding both shigola and shigola-docs, so the
      # repo landed at /workspace/shigola/shigola and go.mod was not found.
      - .:/workspace/shigola:cached
      - go-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      CGO_ENABLED: "1"
      PGHOST: postgis
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # The Go tests read PGURI, not the PG* variables above: PG* configure psql,
      # PGURI configures the provider under test, and its default points at
      # localhost, which inside this container is not the database. Set here so
      # RUN_POSTGIS_TESTS=yes is the only thing left to export -- and note that
      # exporting provider/postgis/README.md's localhost block in here would
      # override these and break the connection, which that README now says.
      PGURI: postgres://postgres:postgres@postgis:5432/shigola?sslmode=disable
      PGURI_NO_ACCESS: postgres://shigola_no_access:postgres@postgis:5432/shigola?sslmode=disable
      PGSSLMODE: disable
    depends_on:
      redis:
        condition: service_started
      postgis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

volumes:
  go-cache:
  go-build-cache:
