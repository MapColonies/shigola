name: shigola-upload-path
description: "returns the correct upload path for os"
inputs:
  name:
    description: "base dir name"
    default: "shigola"
    required: false

outputs:
  dir-path:
    description: "dir path for shigola"
    value: ${{ steps.compute-path.outputs.dir-path }}

runs:
  using: "composite"
  steps:
    - name: set env (not Windows)
      if: ${{ runner.os != 'Windows' }}
      run: echo "SHIGOLA_PATH=cmd/${{inputs.name}}/" >> $GITHUB_ENV
      shell: bash

    - name: set env (Windows)
      if: ${{ runner.os == 'Windows' }}
      run: echo "SHIGOLA_PATH=cmd\\${{inputs.name}}\\" >> $GITHUB_ENV
      shell: bash

    - id: compute-path
      run: echo "dir-path=${SHIGOLA_PATH}" >> $GITHUB_OUTPUT
      shell: bash
