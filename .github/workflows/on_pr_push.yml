name: On push
on: [push, pull_request]
jobs:
  test:
    name: Test on Ubuntu
    runs-on: ubuntu-22.04

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Env Debug
        run: |
          go env
          pwd
          echo ${HOME}
          echo ${GITHUB_WORKSPACE}

      # The tree is cgo-free (internal/build.TestNoCgoConstraints), and the
      # release builds pin CGO_ENABLED=0 on the strength of that. The suite
      # cannot check it: `go test -race` links a C runtime for its detector and
      # so needs cgo, which is why the tests below run with CGO_ENABLED unset.
      #
      # So compile the tree once with cgo off -- the packages and every test
      # binary. `go build ./...` alone would not: it never compiles a _test.go
      # file, so a cgo dependency reachable only from a test would pass here and
      # then break anyone building the suite without a C toolchain. `-run '^$'`
      # matches no test, so the second command links each test binary and runs
      # none of them; seconds against the suite's minutes.
      #
      # This is what keeps "shigola builds with no C toolchain" a checked fact
      # rather than an assumption the release workflow rests on (MAPCO-11489).
      # Before the fixture comes up, because it needs no fixture and a break
      # here should not wait on a database restore.
      - name: Check the tree builds without cgo
        env:
          CGO_ENABLED: 0
        run: |
          go build ./...
          go test -run '^$' ./...

      # `up -d` returns as soon as the containers start, not when the fixture is
      # loaded, so the suite could begin against a half-restored database. The
      # devcontainer gates on migration's service_completed_successfully; this is
      # the same gate for CI, and it matters more now the dump carries Athens and
      # takes longer to restore. migration.sh runs under `set -eo pipefail`, so a
      # failed restore reaches us as a non-zero status rather than as an empty
      # database the tests then blame.
      - name: Setup test environment
        run: |
          docker compose up -d
          status=$(docker wait migration)
          docker logs migration
          if [ "$status" != "0" ]; then
            echo "::error::fixture migration failed with exit status $status"
            exit 1
          fi

      - name: Postgres Debug
        env:
          PGUSER: postgres
          PGHOST: localhost
          PGDATABASE: postgres
          PGPASSWORD: postgres
        run: |
          psql -c "\l"

      - name: Run tests
        env:
          # redis tests
          RUN_REDIS_TESTS: yes

          # AWS S3 tests
          RUN_S3_TESTS: yes
          # The bucket keeps its pre-rename name: it is an existing S3 bucket,
          # and a bucket cannot be renamed, only replaced. Rename it here when
          # that happens.
          AWS_TEST_BUCKET: tegola-ci
          AWS_REGION: us-east-2

          # PostGIS tests
          RUN_POSTGIS_TESTS: yes
          PGURI: postgres://postgres:postgres@localhost:5432/shigola
          PGURI_NO_ACCESS: postgres://shigola_no_access:postgres@localhost:5432/shigola
          PGSSLMODE: disable
          PGSSLKEY: ''
          PGSSLCERT: ''
          PGSSLROOTCERT: ''
        # -race, not just -covermode atomic: atomic is race-safe *counting*, not
        # race *detection*. The cache write path runs a goroutine pool, detached
        # contexts and a concurrent tier fan-out, none of which -covermode checks.
        run: |
          go test -race -covermode atomic -coverprofile=profile.cov ./...

      - name: Send coverage report to Coveralls
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # secrets.GITHUB_TOKEN is always injected on GitHub-hosted runs, so
          # this only fires locally (act) or wherever secrets are absent. There
          # the upload is pure telemetry and must not fail the job.
          if [ -z "$COVERALLS_TOKEN" ]; then
            echo "Skipping Coveralls upload: no GitHub token is available"
            exit 0
          fi
          go install github.com/mattn/goveralls
          $(go env GOPATH)/bin/goveralls -coverprofile=profile.cov -service=github

      # Deliberately after the Coveralls upload rather than before it: when this
      # step fails, the run that produced the number is already recorded, so the
      # drop can be read there instead of only in this log.
      #
      # The floor lives in ci/coverage-baseline.txt, not here. A number in the
      # workflow and a baseline in the tree drift apart, and then nobody can say
      # which one was ever measured.
      #
      # The baseline is measured with RUN_POSTGIS_TESTS and RUN_REDIS_TESTS only
      # (see its `gates` header), because those are the only suites a contributor
      # can provision from this repository. This job also enables RUN_S3_TESTS,
      # which really does run here and covers a lot more of cache/s3 than the
      # baseline records.
      #
      # So the total measured here sits comfortably above the recorded one. That
      # is the safe direction, and it is why this gate is not a tight one: it
      # catches a slide, not a percentage point. If it ever inverts, that is a
      # real finding rather than a reason to lower the floor -- read the
      # per-package rows to see which package lost coverage.
      - name: Check coverage against the floor
        run: go run ./ci/coverage

      # always(): the coverage gate above can fail the job, and a teardown that
      # only runs on success leaves the fixture containers behind.
      - name: Tear down test environment
        if: always()
        run: docker compose down

  data:
    name: Tile contents end to end
    runs-on: ubuntu-22.04

    # Its own job rather than a step in `test`, because the point is the name.
    # A failure here means the bytes a client receives changed, and that should
    # say so in the checks list rather than being one line inside a job that
    # fails for a hundred other reasons.
    #
    # Unfiltered on purpose. It runs on documentation-only pull requests too and
    # costs a second fixture spin-up each time. A path filter is a list that
    # drifts: it stops covering a change the day someone adds a package the list
    # does not name, and it fails by silently not running, which is the failure
    # mode a check like this exists to rule out.
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      # Same gate as the test job, and for the same reason: `up -d` returns when
      # the containers start, not when the fixture is loaded, so without waiting
      # the checks run against a half-restored database. migration.sh runs under
      # `set -eo pipefail`, so a failed restore arrives as a non-zero status
      # rather than as an empty database these assertions then blame on the
      # server.
      - name: Provision the PostGIS fixture
        run: |
          docker compose up -d
          status=$(docker wait migration)
          docker logs migration
          if [ "$status" != "0" ]; then
            echo "::error::fixture migration failed with exit status $status"
            exit 1
          fi

      # The whole package, not a list of test names. Every gated check lives in
      # server/tilecontent, so one added there is covered the day it lands --
      # where a `-run` pattern silently stops covering whatever nobody
      # remembered to add to it, and reports ok while matching nothing.
      #
      # RUN_DATA_TESTS gates those checks and nothing else sets it, so they run
      # here and nowhere else, which is what makes this job's name mean
      # something.
      - name: Check tile contents
        env:
          RUN_DATA_TESTS: yes
          PGURI: postgres://postgres:postgres@localhost:5432/shigola
          PGSSLMODE: disable
          PGSSLKEY: ''
          PGSSLCERT: ''
          PGSSLROOTCERT: ''
        # -v so the log names every check and every tile it fetched. Without
        # it a passing run prints one "ok" line, which cannot tell a suite that
        # verified twenty things apart from one that silently verified none --
        # the exact failure this job exists to rule out.
        run: go test -race -v ./server/tilecontent/

      - name: Tear down test environment
        if: always()
        run: docker compose down

  # Its own job, so a formatting or vet failure is named in the checks list
  # and arrives in seconds rather than after the fixture restore and the suite.
  static:
    name: Static checks
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      # Tracked Go files rather than `gofmt -s -l .`: the gate is about what a
      # pull request can change, so an untracked tree on disk -- a local
      # `go mod vendor`, which is ignored and never -s clean -- cannot fail it.
      # Listing files beats filtering gofmt's output, which would have to
      # survive grep exiting 1 on the clean run under the runner's pipefail.
      - name: Check formatting
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -s -l)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt -s clean:"
            echo "$unformatted"
            exit 1
          fi

      # The default analyzers, nothing added: the tree was brought clean against
      # exactly these (MAPCO-11498), so a finding here is new.
      #
      # Twice, because vet only sees the files the build tags select. The second
      # run sets every opt-out tag plus pprof, so the stub files that stand in
      # for a compiled-out backend are vetted too, not only the default build.
      - name: Vet
        run: |
          go vet ./...
          go vet -tags 'noS3Cache noRedisCache noAzblobCache noGCSCache noGpkgProvider noPostgisProvider noPrometheusObserver pprof' ./...

  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Install and run go vulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build_docker_image:
    name: Build Docker Image
    runs-on: ubuntu-22.04

    # Builds, never pushes: publishing is on_release_publish.yml's job. The
    # assertion is the point -- this job used to have no checkout and no
    # configuration at all, and passed without building anything (MAPCO-11501).
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set the version the image should report
        run: echo "VERSION=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: shigola:ci
          build-args: |
            VER=${{ env.VERSION }}
            BRANCH=${{ github.ref_name }}
            REVISION=${{ env.VERSION }}

      # `shigola version` exits 0 even when unstamped, so running it proves
      # nothing on its own. Assert on what it reports.
      - name: Check the image was built and reports this commit
        run: |
          docker image inspect shigola:ci > /dev/null
          reported=$(docker run --rm shigola:ci version)
          echo "$reported"

          want="   version: ${VERSION}"
          grep -qxF "$want" <<< "$reported" || {
            echo "::error::image does not report this commit; expected: ${want}"
            exit 1
          }
