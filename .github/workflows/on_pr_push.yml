name: On push
on: [push, pull_request]
jobs:
  test:
    name: Test on Ubuntu
    runs-on: ubuntu-22.04

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Env Debug
        run: |
          go env
          pwd
          echo ${HOME}
          echo ${GITHUB_WORKSPACE}

      # `up -d` returns as soon as the containers start, not when the fixture is
      # loaded, so the suite could begin against a half-restored database. The
      # devcontainer gates on migration's service_completed_successfully; this is
      # the same gate for CI, and it matters more now the dump carries Athens and
      # takes longer to restore. migration.sh runs under `set -eo pipefail`, so a
      # failed restore reaches us as a non-zero status rather than as an empty
      # database the tests then blame.
      - name: Setup test environment
        run: |
          docker compose up -d
          status=$(docker wait migration)
          docker logs migration
          if [ "$status" != "0" ]; then
            echo "::error::fixture migration failed with exit status $status"
            exit 1
          fi

      - name: Postgres Debug
        env:
          PGUSER: postgres
          PGHOST: localhost
          PGDATABASE: postgres
          PGPASSWORD: postgres
        run: |
          psql -c "\l"

      - name: Run tests
        env:
          # redis tests
          RUN_REDIS_TESTS: yes

          # AWS S3 tests
          RUN_S3_TESTS: yes
          AWS_TEST_BUCKET: tegola-ci
          AWS_REGION: us-east-2

          # PostGIS tests
          RUN_POSTGIS_TESTS: yes
          PGURI: postgres://postgres:postgres@localhost:5432/shigola
          PGURI_NO_ACCESS: postgres://shigola_no_access:postgres@localhost:5432/shigola
          PGSSLMODE: disable
          PGSSLKEY: ''
          PGSSLCERT: ''
          PGSSLROOTCERT: ''

          # HANA tests
          RUN_HANA_TESTS: yes
          # The credentials were exposed on purpose
          # more information see: https://github.com/go-spatial/tegola/pull/893#discussion_r1136602372
          HANA_CONNECTION_STRING: 'hdb://TEGOLACI:iZgd6$nOdhf@917df316-4e01-4a10-be54-eac1b6ab15fb.hana.prod-us10.hanacloud.ondemand.com:443?TLSInsecureSkipVerify&TLSServerName=host&timeout=1000&max_connections=10'
        # -race, not just -covermode atomic: atomic is race-safe *counting*, not
        # race *detection*. The cache write path runs a goroutine pool, detached
        # contexts and a concurrent tier fan-out, none of which -covermode checks.
        run: |
          go test -mod vendor -race -covermode atomic -coverprofile=profile.cov ./...

      - name: Send coverage report to Coveralls
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # secrets.GITHUB_TOKEN is always injected on GitHub-hosted runs, so
          # this only fires locally (act) or wherever secrets are absent. There
          # the upload is pure telemetry and must not fail the job.
          if [ -z "$COVERALLS_TOKEN" ]; then
            echo "Skipping Coveralls upload: no GitHub token is available"
            exit 0
          fi
          go install -mod=vendor github.com/mattn/goveralls
          $(go env GOPATH)/bin/goveralls -coverprofile=profile.cov -service=github

      - name: Build embedded UI
        run: |
          pushd ${GITHUB_WORKSPACE}/server
          go generate ./...
          popd

      - name: Tear down test environment
        run: docker compose down

  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Install and run go vulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build_docker_image:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
