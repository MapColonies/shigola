name: On release publish
# The push trigger is `master`, but `development` is the trunk, so nothing here
# fires on a merge to trunk and `edge` is effectively unpublished (MAPCO-11500).
on:
  pull_request:
  push:
    branches:
      - master
  release:
    types: [published]

jobs:
  gen_version:
    name: Generate software version
    runs-on: ubuntu-22.04

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    # on release, we want to use release.tag_name for the version
    - name: Set shigola version (use release.tag_name)
      if: github.event_name == 'release'
      run: echo ${{ github.event.release.tag_name }} > ${{ github.workspace }}/version.txt

    # when it's not a release build use the commit hash for the version tag
    - name: Set shigola version (use commit hash)
      if: github.event_name != 'release'
      run: echo ${{ github.sha }} | cut -c1-7 > ${{ github.workspace }}/version.txt

    - name: Upload build artifact version
      uses: actions/upload-artifact@v4
      with:
        name: version
        path: ${{ github.workspace }}/version.txt

    # when it's not a release, but we want to perform an action on a new push/pr to default branch
    # we need the default branch ref, which in case of shigola changes with the version
    - name: Get shigola default branch ref
      run: |
        DEFAULT_BRANCH=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
        echo "DEFAULT_BRANCH=$DEFAULT_BRANCH" >> $GITHUB_ENV
        echo "refs/heads/$DEFAULT_BRANCH" > ${{ github.workspace }}/default-branch-ref.txt

    - name: Upload build artifacts default branch ref
      uses: actions/upload-artifact@v4
      with:
        name: default-branch-ref
        path: ${{ github.workspace }}/default-branch-ref.txt

  build_linux_amd64:
    name: Build for Linux (amd64)
    needs: [gen_version]
    runs-on: ubuntu-22.04

    steps:
    - name: Check out actions
      uses: actions/checkout@v4

    - name: Setup env
      uses: ./.github/actions/shigola-setup-env

    - name: Build for Linux
      env:
        # Explicit rather than inherited (MAPCO-11489). Nothing in the tree
        # depends on cgo, and leaving this unset decided linkage by whether the
        # runner had a C compiler and whether the build was a cross-compile --
        # which is why the arm64 artifact was already static and the amd64 one
        # was not. Pinning it to 0 makes every published binary the same shape.
        CGO_ENABLED: 0
        # build architecture
        GOOS: linux
      run: |
          cd cmd/shigola
          go build -mod vendor -ldflags "-w -X ${BUILD_PKG}.Version=${VERSION} -X ${BUILD_PKG}.GitRevision=${GIT_REVISION} -X ${BUILD_PKG}.GitBranch=${GIT_BRANCH}"

    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        artifact_name: "shigola"
        release_archive_name: "shigola_linux_amd64"

  build_linux_arm:
    name: Build for Linux (arm64)
    needs: [gen_version]
    runs-on: ubuntu-22.04

    steps:
    - name: Check out actions
      uses: actions/checkout@v4

    - name: Setup env
      uses: ./.github/actions/shigola-setup-env

    - name: Build for Linux
      env:
        # Pinned for the reason given on build_linux_amd64 above.
        CGO_ENABLED: 0
        # build architecture
        GOOS: linux
        GOARCH: arm64
      run: |
          cd cmd/shigola
          go build -mod vendor -ldflags "-w -X ${BUILD_PKG}.Version=${VERSION} -X ${BUILD_PKG}.GitRevision=${GIT_REVISION} -X ${BUILD_PKG}.GitBranch=${GIT_BRANCH}"

    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        artifact_name: "shigola"
        release_archive_name: "shigola_linux_arm64"

  build_shigola_lambda_amd64:
    name: Build shigola_lambda (amd64)
    needs: [gen_version]
    runs-on: ubuntu-22.04

    steps:
    - name: Check out actions
      uses: actions/checkout@v4

    - name: Setup env
      uses: ./.github/actions/shigola-setup-env
      with:
        go: true

    # Built on the runner like every other artifact. This used to go through a
    # docker action that built inside an Amazon Linux image, so a cgo-linked
    # binary would match the Lambda runtime's glibc. The build is cgo-free now
    # (MAPCO-11489), so the binary is static and where it is compiled no longer
    # changes it -- and the image cost a yum install and a container start per
    # architecture to prove it.
    - name: Build shigola_lambda
      env:
        # Pinned for the reason given on build_linux_amd64 above.
        CGO_ENABLED: 0
        GOOS: linux
        GOARCH: amd64
      run: |
          cd cmd/shigola_lambda
          go build -mod vendor -tags lambda.norpc \
            -ldflags "-w -X ${BUILD_PKG}.Version=${VERSION} -X ${BUILD_PKG}.GitRevision=${GIT_REVISION} -X ${BUILD_PKG}.GitBranch=${GIT_BRANCH}" \
            -o bootstrap

    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        artifact_name: "bootstrap"
        cmd_subdir: "shigola_lambda"
        release_archive_name: "shigola_lambda_amd64"

  build_shigola_lambda_arm64:
    name: Build shigola_lambda (arm64)
    needs: [gen_version]
    runs-on: ubuntu-22.04

    steps:
    - name: Check out actions
      uses: actions/checkout@v4

    - name: Setup env
      uses: ./.github/actions/shigola-setup-env
      with:
        go: true

    # Built on the runner like every other artifact. This used to go through a
    # docker action that built inside an Amazon Linux image, so a cgo-linked
    # binary would match the Lambda runtime's glibc. The build is cgo-free now
    # (MAPCO-11489), so the binary is static and where it is compiled no longer
    # changes it -- and the image cost a yum install and a container start per
    # architecture to prove it.
    - name: Build shigola_lambda
      env:
        # Pinned for the reason given on build_linux_amd64 above.
        CGO_ENABLED: 0
        GOOS: linux
        GOARCH: arm64
      run: |
          cd cmd/shigola_lambda
          go build -mod vendor -tags lambda.norpc \
            -ldflags "-w -X ${BUILD_PKG}.Version=${VERSION} -X ${BUILD_PKG}.GitRevision=${GIT_REVISION} -X ${BUILD_PKG}.GitBranch=${GIT_BRANCH}" \
            -o bootstrap

    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        artifact_name: "bootstrap"
        cmd_subdir: "shigola_lambda"
        release_archive_name: "shigola_lambda_arm64"

  build_macos:
    name: Build for MacOS
    needs: [gen_version]
    runs-on: macos-latest

    steps:
    - name: Check out actions
      uses: actions/checkout@v4

    - name: Setup env
      uses: ./.github/actions/shigola-setup-env

    - name: Build for Darwin
      env:
        # Pinned for the reason given on build_linux_amd64 above.
        CGO_ENABLED: 0
        GOOS: darwin
      run: |
          cd cmd/shigola
          go build -mod vendor -ldflags "-w -X ${BUILD_PKG}.Version=${VERSION} -X ${BUILD_PKG}.GitRevision=${GIT_REVISION} -X ${BUILD_PKG}.GitBranch=${GIT_BRANCH}"

    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        artifact_name: "shigola"
        release_archive_name: "shigola_darwin_amd64"

  build_docker:
    name: Build Docker image and publish to ACR
    needs: [gen_version]
    runs-on: ubuntu-22.04
    env:
      # MapColonies' ACR. Used to push to `gospatial`, upstream's Docker Hub
      # namespace (MAPCO-11500).
      #
      # Not using the org's shared build-and-push-docker workflow: it runs a
      # bare `docker build` with no --build-arg, so its images report no
      # version. Image name matches its `<registry>/<scope>/<name>` shape.
      ACR_URL: ${{ secrets.ACR_URL }}
      IMAGE_SCOPE: vector
      IMAGE_NAME: shigola

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Setup env
      uses: ./.github/actions/shigola-setup-env

    # Must run after "Setup env", and must be a step: a job-level `env:` is
    # evaluated too early AND gets no `${VAR}` expansion, so the old
    # `VER=${VERSION}` reached docker build literally (MAPCO-11500).
    #
    # Assembled once so the image we assert on and the images we push cannot be
    # built from different args.
    - name: Assemble image reference and build args
      run: |
        # Downcased: a registry host may have capitals, a Docker ref may not.
        image="${ACR_URL:-local}/${IMAGE_SCOPE}/${IMAGE_NAME}"
        echo "IMAGE=${image,,}" >> "$GITHUB_ENV"

        {
          echo 'BUILD_ARGS<<BUILD_ARGS_EOF'
          echo "BUILDPKG=${BUILD_PKG}"
          echo "VER=${VERSION}"
          echo "BRANCH=${GIT_BRANCH}"
          echo "REVISION=${GIT_REVISION}"
          echo 'BUILD_ARGS_EOF'
        } >> "$GITHUB_ENV"

    # A release must publish or fail, so this is the one place credentials are
    # checked up front rather than skipped around. Without ACR_URL the image
    # reference assembled above falls back to `local/vector/shigola`, whose
    # first component carries no dot or colon -- so docker reads it as a path
    # on Docker Hub rather than as a registry host, and a release with no
    # credentials spends several minutes building and then tries to push to a
    # registry we do not own, failing there on authorization with an error
    # naming no secret. Fail here instead, saying what is missing
    # (MAPCO-11503).
    #
    # Every other event skips cleanly past this: nothing above needs
    # credentials, and the edge push below gates itself on ACR_URL.
    - name: Require registry credentials for a release
      if: github.event_name == 'release'
      env:
        ACR_PUSH_USER: ${{ secrets.ACR_PUSH_USER }}
        ACR_PUSH_TOKEN: ${{ secrets.ACR_PUSH_TOKEN }}
      run: |
        status=0

        for secret in ACR_URL ACR_PUSH_USER ACR_PUSH_TOKEN; do
          if [[ -z "${!secret}" ]]; then
            echo "::error::secret ${secret} is not set; a release cannot publish without it"
            status=1
          fi
        done

        exit $status

    # amd64 only: buildx can only load one platform into docker. Cached, so the
    # publish steps below do not rebuild it.
    #
    # Not gated on credentials -- gating it is how the broken stamp survived: no
    # secrets meant build and check were skipped and the job still went green.
    - name: Build docker image for testing
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        platforms: linux/amd64
        build-args: ${{ env.BUILD_ARGS }}
        tags: ${{ env.IMAGE }}:${{ env.VERSION }}

    # `shigola version` exits 0 even when unstamped, so the old step that merely
    # ran it passed against images reporting "version not set". Assert instead.
    #
    # This is the pre-push half of the pair: it checks that the build args
    # produced a stamped binary, on every event, before anything is published.
    # What the registry ends up serving is asserted after the push below.
    - name: Assert the built image reports its version, branch and revision
      run: |
        reported=$(docker run --rm "${IMAGE}:${VERSION}" version)
        echo "$reported"

        # Exact lines cmd/shigola/cmd/version.go prints.
        want_version="   version: ${VERSION}"
        want_git="       git: ${GIT_BRANCH} @ ${GIT_REVISION}"

        status=0
        grep -qxF "$want_version" <<< "$reported" || {
          echo "::error::image does not report its version; expected: ${want_version}"
          status=1
        }
        grep -qxF "$want_git" <<< "$reported" || {
          echo "::error::image does not report its branch and revision; expected: ${want_git}"
          status=1
        }
        exit $status

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      if: env.ACR_URL != ''
      with:
        registry: ${{ secrets.ACR_URL }}
        username: ${{ secrets.ACR_PUSH_USER }}
        password: ${{ secrets.ACR_PUSH_TOKEN }}

    - name: Publish Docker edge container
      if: github.ref == env.DEFAULT_BRANCH_REF && env.ACR_URL != ''
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE }}:edge
        platforms: linux/amd64,linux/arm64
        build-args: ${{ env.BUILD_ARGS }}

    # Not gated on ACR_URL, unlike the edge push: skipping an edge push without
    # credentials is fine, but a release must publish or fail -- never silently
    # do nothing and report success.
    - name: Publish Docker container
      if: github.event_name == 'release'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE }}:${{ env.VERSION }},${{ env.IMAGE }}:latest
        platforms: linux/amd64,linux/arm64
        build-args: ${{ env.BUILD_ARGS }}

    # The pre-push assertion ran the image this runner built, and buildx can
    # only load one platform into docker, so it saw amd64 and nothing else.
    # This reads both architectures of both tags back out of the registry,
    # which is the claim a release actually has to make: that what was
    # published reports the version it was published as. QEMU, set up at the
    # top of this job, is what lets the arm64 image run here (MAPCO-11503).
    - name: Assert the published images report the release version
      if: github.event_name == 'release'
      run: |
        status=0

        for tag in "${VERSION}" latest; do
          for platform in linux/amd64 linux/arm64; do
            ref="${IMAGE}:${tag}"
            echo "--- ${ref} (${platform})"

            # --pull always: this runner is holding the layers it just built
            # and a tag pointing at them, so without this docker answers from
            # that cache and the registry is never consulted.
            if ! reported=$(docker run --rm --pull always --platform "${platform}" "${ref}" version); then
              echo "::error::${ref} does not run on ${platform}"
              status=1

              continue
            fi

            echo "$reported"

            # latest is held to the same version on purpose: a latest still
            # pointing at the previous release is what this catches.
            if ! grep -qxF "   version: ${VERSION}" <<< "$reported"; then
              echo "::error::${ref} on ${platform} reports something other than ${VERSION}"
              status=1
            fi
          done
        done

        exit $status

  build_windows:
    name: Build for Windows
    needs: [gen_version]
    runs-on: windows-latest

    steps:
    - name: Check out actions
      uses: actions/checkout@v4

    - name: Setup env
      uses: ./.github/actions/shigola-setup-env

    - name: Build for Windows
      env:
        # Pinned for the reason given on build_linux_amd64 above.
        CGO_ENABLED: 0
      run: |
          cd cmd\shigola
          go build -ldflags "-w -X $Env:BUILD_PKG.Version=$Env:VERSION -X $Env:BUILD_PKG.GitRevision=$Env:GIT_REVISION -X $Env:BUILD_PKG.GitBranch=$Env:GIT_BRANCH"

    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        artifact_name: "shigola"
        release_archive_name: "shigola_windows_amd64"
