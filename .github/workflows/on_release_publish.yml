name: On release publish
# Binaries only. The container image is built, published and registered by
# build_and_push.yml, which fires on the `vX.Y.Z` tag the same release pushes
# (MAPCO-11503).
#
# The pull_request and push triggers are here so the cross-compiles are a
# compile check on the way in; only the release event attaches anything to a
# release. The push trigger is `master`, but `development` is the trunk, so
# nothing here fires on a merge to trunk (MAPCO-11500).
on:
  pull_request:
  push:
    branches:
      - master
  release:
    types: [published]

jobs:
  gen_version:
    name: Generate software version
    runs-on: ubuntu-22.04

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    # on release, we want to use release.tag_name for the version
    - name: Set shigola version (use release.tag_name)
      if: github.event_name == 'release'
      run: echo ${{ github.event.release.tag_name }} > ${{ github.workspace }}/version.txt

    # when it's not a release build use the commit hash for the version tag
    - name: Set shigola version (use commit hash)
      if: github.event_name != 'release'
      run: echo ${{ github.sha }} | cut -c1-7 > ${{ github.workspace }}/version.txt

    - name: Upload build artifact version
      uses: actions/upload-artifact@v4
      with:
        name: version
        path: ${{ github.workspace }}/version.txt

    # when it's not a release, but we want to perform an action on a new push/pr to default branch
    # we need the default branch ref, which in case of shigola changes with the version
    - name: Get shigola default branch ref
      run: |
        DEFAULT_BRANCH=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
        echo "DEFAULT_BRANCH=$DEFAULT_BRANCH" >> $GITHUB_ENV
        echo "refs/heads/$DEFAULT_BRANCH" > ${{ github.workspace }}/default-branch-ref.txt

    - name: Upload build artifacts default branch ref
      uses: actions/upload-artifact@v4
      with:
        name: default-branch-ref
        path: ${{ github.workspace }}/default-branch-ref.txt

  build_linux_amd64:
    name: Build for Linux (amd64)
    needs: [gen_version]
    runs-on: ubuntu-22.04

    steps:
    - name: Check out actions
      uses: actions/checkout@v4

    - name: Setup env
      uses: ./.github/actions/shigola-setup-env

    - name: Build for Linux
      env:
        # Explicit rather than inherited (MAPCO-11489). Nothing in the tree
        # depends on cgo, and leaving this unset decided linkage by whether the
        # runner had a C compiler and whether the build was a cross-compile --
        # which is why the arm64 artifact was already static and the amd64 one
        # was not. Pinning it to 0 makes every published binary the same shape.
        CGO_ENABLED: 0
        # build architecture
        GOOS: linux
      run: |
          cd cmd/shigola
          go build -ldflags "-w -X ${BUILD_PKG}.Version=${VERSION} -X ${BUILD_PKG}.GitRevision=${GIT_REVISION} -X ${BUILD_PKG}.GitBranch=${GIT_BRANCH}"

    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        artifact_name: "shigola"
        release_archive_name: "shigola_linux_amd64"

  build_linux_arm:
    name: Build for Linux (arm64)
    needs: [gen_version]
    runs-on: ubuntu-22.04

    steps:
    - name: Check out actions
      uses: actions/checkout@v4

    - name: Setup env
      uses: ./.github/actions/shigola-setup-env

    - name: Build for Linux
      env:
        # Pinned for the reason given on build_linux_amd64 above.
        CGO_ENABLED: 0
        # build architecture
        GOOS: linux
        GOARCH: arm64
      run: |
          cd cmd/shigola
          go build -ldflags "-w -X ${BUILD_PKG}.Version=${VERSION} -X ${BUILD_PKG}.GitRevision=${GIT_REVISION} -X ${BUILD_PKG}.GitBranch=${GIT_BRANCH}"

    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        artifact_name: "shigola"
        release_archive_name: "shigola_linux_arm64"

  build_shigola_lambda_amd64:
    name: Build shigola_lambda (amd64)
    needs: [gen_version]
    runs-on: ubuntu-22.04

    steps:
    - name: Check out actions
      uses: actions/checkout@v4

    - name: Setup env
      uses: ./.github/actions/shigola-setup-env
      with:
        go: true

    # Built on the runner like every other artifact. This used to go through a
    # docker action that built inside an Amazon Linux image, so a cgo-linked
    # binary would match the Lambda runtime's glibc. The build is cgo-free now
    # (MAPCO-11489), so the binary is static and where it is compiled no longer
    # changes it -- and the image cost a yum install and a container start per
    # architecture to prove it.
    - name: Build shigola_lambda
      env:
        # Pinned for the reason given on build_linux_amd64 above.
        CGO_ENABLED: 0
        GOOS: linux
        GOARCH: amd64
      run: |
          cd cmd/shigola_lambda
          go build -tags lambda.norpc \
            -ldflags "-w -X ${BUILD_PKG}.Version=${VERSION} -X ${BUILD_PKG}.GitRevision=${GIT_REVISION} -X ${BUILD_PKG}.GitBranch=${GIT_BRANCH}" \
            -o bootstrap

    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        artifact_name: "bootstrap"
        cmd_subdir: "shigola_lambda"
        release_archive_name: "shigola_lambda_amd64"

  build_shigola_lambda_arm64:
    name: Build shigola_lambda (arm64)
    needs: [gen_version]
    runs-on: ubuntu-22.04

    steps:
    - name: Check out actions
      uses: actions/checkout@v4

    - name: Setup env
      uses: ./.github/actions/shigola-setup-env
      with:
        go: true

    # Built on the runner like every other artifact. This used to go through a
    # docker action that built inside an Amazon Linux image, so a cgo-linked
    # binary would match the Lambda runtime's glibc. The build is cgo-free now
    # (MAPCO-11489), so the binary is static and where it is compiled no longer
    # changes it -- and the image cost a yum install and a container start per
    # architecture to prove it.
    - name: Build shigola_lambda
      env:
        # Pinned for the reason given on build_linux_amd64 above.
        CGO_ENABLED: 0
        GOOS: linux
        GOARCH: arm64
      run: |
          cd cmd/shigola_lambda
          go build -tags lambda.norpc \
            -ldflags "-w -X ${BUILD_PKG}.Version=${VERSION} -X ${BUILD_PKG}.GitRevision=${GIT_REVISION} -X ${BUILD_PKG}.GitBranch=${GIT_BRANCH}" \
            -o bootstrap

    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        artifact_name: "bootstrap"
        cmd_subdir: "shigola_lambda"
        release_archive_name: "shigola_lambda_arm64"

  build_macos:
    name: Build for MacOS
    needs: [gen_version]
    runs-on: macos-latest

    steps:
    - name: Check out actions
      uses: actions/checkout@v4

    - name: Setup env
      uses: ./.github/actions/shigola-setup-env

    - name: Build for Darwin
      env:
        # Pinned for the reason given on build_linux_amd64 above.
        CGO_ENABLED: 0
        GOOS: darwin
      run: |
          cd cmd/shigola
          go build -ldflags "-w -X ${BUILD_PKG}.Version=${VERSION} -X ${BUILD_PKG}.GitRevision=${GIT_REVISION} -X ${BUILD_PKG}.GitBranch=${GIT_BRANCH}"

    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        artifact_name: "shigola"
        release_archive_name: "shigola_darwin_amd64"

  build_windows:
    name: Build for Windows
    needs: [gen_version]
    runs-on: windows-latest

    steps:
    - name: Check out actions
      uses: actions/checkout@v4

    - name: Setup env
      uses: ./.github/actions/shigola-setup-env

    - name: Build for Windows
      env:
        # Pinned for the reason given on build_linux_amd64 above.
        CGO_ENABLED: 0
      run: |
          cd cmd\shigola
          go build -ldflags "-w -X $Env:BUILD_PKG.Version=$Env:VERSION -X $Env:BUILD_PKG.GitRevision=$Env:GIT_REVISION -X $Env:BUILD_PKG.GitBranch=$Env:GIT_BRANCH"

    - name: Upload artifact
      uses: ./.github/actions/upload-artifact
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        artifact_name: "shigola"
        release_archive_name: "shigola_windows_amd64"
