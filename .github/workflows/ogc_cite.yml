name: OGC CITE conformance

# The OGC compliance suite is a black-box test: it crawls the API the way a
# client would and checks the responses against the standard's abstract tests.
# That makes it the only thing here that can catch a conformance rule the code
# has no way to check about itself — the OpenAPI operationId requirement, for
# one, which no unit test could have found.
#
# It is slower and heavier than `go test` (a ~1 GB TeamEngine image), so it runs
# when something that shapes the OGC surface changes, on demand, and weekly to
# catch drift in the suite itself.

on:
  push:
    paths:
      - 'server/ogc/**'
      - 'server/server.go'
      - 'tms/**'
      - 'atlas/**'
      - 'provider/postgis/**'
      - 'testdata/postgis/**'
      - 'docker-compose.yml'
      - '.github/cite/**'
      - '.github/workflows/ogc_cite.yml'
  pull_request:
    paths:
      - 'server/ogc/**'
      - 'server/server.go'
      - 'tms/**'
      - 'atlas/**'
      - 'provider/postgis/**'
      - 'testdata/postgis/**'
      - 'docker-compose.yml'
      - '.github/cite/**'
      - '.github/workflows/ogc_cite.yml'
  workflow_dispatch:
  schedule:
    # Mondays, 04:00 UTC. The suite is versioned independently of this
    # repository, so a passing implementation can start failing without a commit.
    - cron: '0 4 * * 1'

jobs:
  cite:
    name: OGC API - Tiles conformance
    runs-on: ubuntu-22.04

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      # The suite's data is the Athens OSM extract in the PostGIS fixture; it used
      # to be a GeoPackage checked into the tree, which needed no provisioning and
      # made this workflow's evidence an invisible dependency of the GeoPackage
      # provider. That provider is gone (MAPCO-11488); the dependency was moved
      # here first, deliberately, so the evidence outlived it.
      #
      # `up -d` returns as soon as the containers start, not when the fixture is
      # loaded, so the suite could otherwise begin against a half-restored
      # database. This is the same gate on_pr_push.yml uses: migration.sh runs
      # under `set -eo pipefail`, so a failed restore arrives as a non-zero status
      # rather than as an empty database the suite then blames on the service.
      - name: Provision the PostGIS fixture
        run: |
          docker compose up -d
          status=$(docker wait migration)
          docker logs migration
          if [ "$status" != "0" ]; then
            echo "::error::fixture migration failed with exit status $status"
            exit 1
          fi

      # No build flags: there is no GeoPackage provider to exclude any more, and
      # nothing left in the tree that cgo changes, so this is the ordinary
      # build. "Conformance passes with no GeoPackage present" is now a fact
      # about every shigola binary rather than about this one -- which is what
      # deleting the provider bought, and why the flags that used to stand in
      # for it are not worth keeping as decoration.
      - name: Build shigola
        run: go build -mod vendor -o "${{ runner.temp }}/shigola" ./cmd/shigola

      # Pulled before shigola starts so the ~1 GB download is not counted against
      # the readiness timeouts in run.sh.
      - name: Pull the TeamEngine suite
        run: docker pull ogccite/ets-ogcapi-tiles10

      # A bind clash makes shigola panic rather than exit cleanly, so run.sh's
      # readiness poll is what turns that into a legible failure.
      #
      # A shell expansion, deliberately not a ${{ }} expression: it reads the
      # runner's own environment, so `SHIGOLA_PORT=9081 act ...` reaches it. A
      # workflow-level `env:` default would not -- that takes precedence over the
      # process environment and would pin the port at its literal.
      #
      # The TEGOLA_PORT leg must match run.sh exactly. Without it, setting only
      # the legacy name binds the server on 8081 while the suite polls 9081, and
      # the only symptom is run.sh's readiness poll timing out.
      - name: Start shigola
        run: |
          "${{ runner.temp }}/shigola" serve --config .github/cite/config.toml --port ":${SHIGOLA_PORT:-${TEGOLA_PORT:-8081}}" &
          echo $! > shigola.pid

      # Both declared tiling schemes: the tile differs because the same ground is
      # a different tile in each, which is the property the whole TileMatrixSet
      # abstraction exists for. A WorldCRS84Quad tile is half the width and a bit
      # over half the height of a WebMercatorQuad one at the same zoom, so the two
      # cannot be the same index — and the WorldCRS84Quad tile here is the nearest
      # one in Athens that holds all three layers, which ST_AsMVT will only emit
      # for layers that have rows. TestCiteConformanceWorkflowTiles checks these
      # arguments against the config that serves them.
      - name: Run the suite — WebMercatorQuad
        run: .github/cite/run.sh WebMercatorQuad 14 6324 9271 cite-WebMercatorQuad.xml

      - name: Run the suite — WorldCRS84Quad
        run: .github/cite/run.sh WorldCRS84Quad 14 4740 18542 cite-WorldCRS84Quad.xml

      # Uploaded even on failure: the EARL report names the assertion that broke
      # and why, which the step log summarises but does not reproduce in full.
      - name: Upload the EARL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cite-earl-reports
          path: cite-*.xml
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: |
          [ -f shigola.pid ] && kill "$(cat shigola.pid)" || true
          docker rm -f cite-teamengine >/dev/null 2>&1 || true
          docker compose down
