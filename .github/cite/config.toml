# Shigola configuration for the OGC CITE conformance run.
#
# The suite fetches tiles and inspects what comes back, so it needs real data:
# this serves the Athens OSM extract out of the PostGIS fixture
# (testdata/postgis/shigola.dump), through ST_AsMVT.
#
# It used to serve the same three layers out of provider/gpkg/testdata via the
# GeoPackage provider, which made the project's only external conformance
# evidence an invisible dependency of that provider — removing it would have
# deleted the evidence and said nothing. Moving the data here first is what let
# that provider be deleted (MAPCO-11488) without taking the evidence with it.
# Nothing here is file-backed now, and config/config_cite_test.go pins the
# provider type this file is allowed to name, so a relapse to any file-backed
# source fails a unit test rather than surfacing as a weekly CI job that
# quietly stopped proving anything.
#
# The map declares both distinct servable tiling schemes so the tilesets list,
# the per-scheme tileset metadata, and the tile paths are all exercised rather
# than assumed. .github/workflows/ogc_cite.yml runs the suite once per scheme;
# TestCiteConformanceWorkflowTiles keeps the two lists in agreement.

# The port is passed on the command line rather than set here, so that the value
# run.sh polls and the value Shigola binds cannot drift apart.
[webserver]
hostname = "localhost"

# A literal URI, not ${PGURI}. env interpolation has no default and fails the
# whole config load when the variable is unset, so ${PGURI} would make serving
# this file depend on ambient environment — the opposite of what a fixture
# wants. This is the database `docker compose up -d` publishes, which is what
# CI and the documented local run both use.
#
# srid = 4326 because the Athens tables are stored in 4326, and !BBOX! arrives
# in the *layer's* SRID: the provider transforms the tile's own extent into it.
# The tile's own CRS arrives separately, as !TILE_SRID! and !TILE_BBOX! — see the
# layer SQL below.
[[providers]]
name = "athens"
type = "mvt_postgis"
uri = "postgres://postgres:postgres@localhost:5432/shigola?sslmode=disable"
srid = 4326

# geometry_type is declared rather than inferred: with a `sql` layer the provider
# would otherwise inspect the query at startup to guess it.
#
# ST_AsMVTGeom maps its envelope affinely onto the tile's 0..4096 grid, so the
# envelope decides which CRS's axis the tile is spaced by. It has to be the
# scheme's, which is why the geometry is transformed to !TILE_SRID! and clipped
# against !TILE_BBOX! rather than against !BBOX!.
#
# !BBOX! still does the selecting: it arrives in the layer's own 4326, which is
# the SRID the GiST index is built in. The two envelopes are the same rectangle
# for a WorldCRS84Quad tile and different ones for a WebMercatorQuad tile, and
# writing both is what makes one SQL string exact in either scheme (MAPCO-11599).
#
# This used to pass !BBOX! to ST_AsMVTGeom unwrapped, which was exact for
# WorldCRS84Quad and out by the difference between latitude and mercator y for
# WebMercatorQuad — roughly 100 units in 4096 at zoom 4, half a unit at zoom 14.
# That error is why the zoom window below is as narrow as it is. The constraint
# is gone; the window is left where it was because widening it changes what the
# conformance suite is run against, which is a separate decision from this fix.
  [[providers.layers]]
  name = "land_polygons"
  geometry_type = "multipolygon"
  id_fieldname = "fid"
  sql = "SELECT ST_AsMVTGeom(ST_Transform(geom,!TILE_SRID!),!TILE_BBOX!) AS geom, fid FROM land_polygons WHERE geom && !BBOX!"

  [[providers.layers]]
  name = "roads_lines"
  geometry_type = "multilinestring"
  id_fieldname = "fid"
  sql = "SELECT ST_AsMVTGeom(ST_Transform(geom,!TILE_SRID!),!TILE_BBOX!) AS geom, fid, highway FROM roads_lines WHERE geom && !BBOX!"

  [[providers.layers]]
  name = "places_points"
  geometry_type = "point"
  id_fieldname = "fid"
  sql = "SELECT ST_AsMVTGeom(ST_Transform(geom,!TILE_SRID!),!TILE_BBOX!) AS geom, fid, place, is_in FROM places_points WHERE geom && !BBOX!"

# The zoom window brackets the zoom .github/workflows/ogc_cite.yml asks for, and
# TestCiteConformanceWorkflowTiles fails if the workflow moves outside it. It was
# narrow because the layer SQL was only accurate for both schemes over this
# range; the SQL above is now accurate at every zoom, so the window is a
# statement about what the suite is run against rather than about accuracy.
[[maps]]
name = "athens"
attribution = "OpenStreetMap contributors"
center = [23.7068, 37.8975, 12.0]
bounds = [23.6, 37.85, 23.8, 37.95]
tile_matrix_sets = ["WebMercatorQuad", "WorldCRS84Quad"]

  [[maps.layers]]
  name = "land"
  provider_layer = "athens.land_polygons"
  min_zoom = 13
  max_zoom = 15

  [[maps.layers]]
  name = "roads"
  provider_layer = "athens.roads_lines"
  min_zoom = 13
  max_zoom = 15

  [[maps.layers]]
  name = "places"
  provider_layer = "athens.places_points"
  min_zoom = 13
  max_zoom = 15
